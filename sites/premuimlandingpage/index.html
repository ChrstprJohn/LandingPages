    <style>
      .opening-signature { display: none; position: fixed; inset: 0; z-index: 65; place-items: center; overflow: hidden; background: #050505; color: #ff3b12; pointer-events: none; }

      .opening-signature svg { display: block; width: 100%; height: auto; }
      .opening-signature path { fill: none; stroke: currentColor; stroke-width: 3.35; stroke-linecap: round; stroke-linejoin: round; }
      .show-opening .opening-signature path { animation: draw-signature 2.6s linear both; stroke-dasharray: 1; }
      .opening-dot { fill: currentColor; opacity: 0; }
      .show-opening .opening-dot { animation: sign-dot .08s 2.58s both; }
      @keyframes draw-signature { 0% { stroke-dashoffset: 1; opacity: 0; } 1% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes sign-dot { to { opacity: 1; } }
      @media (max-width: 600px) { .opening-signature svg { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .show-opening .opening-signature { display: none; } }
    </style>
